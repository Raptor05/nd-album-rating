name: Build

# Runs on every push and pull request: tests the code and builds the plugin.
# The resulting .ndp file is available as a workflow artifact for 30 days.
on:
  push:
    branches: [main]
    paths-ignore: ["**.md"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  PLUGIN_ID: album-rating

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: stable
          cache: false

      - name: Resolve dependencies
        run: go mod tidy

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -v ./...

      - name: Build WebAssembly module
        run: GOOS=wasip1 GOARCH=wasm go build -buildmode=c-shared -o plugin.wasm .

      - name: Package plugin
        run: zip -j "${PLUGIN_ID}.ndp" manifest.json plugin.wasm

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.PLUGIN_ID }}
          path: ${{ env.PLUGIN_ID }}.ndp
          retention-days: 30
